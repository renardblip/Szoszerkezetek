<title>Szószerkezetek és az állítmány – hangos animáció</title>

html{scroll-padding-top:env(safe-area-inset-top,0px)}

h1{font-size:1.4rem;margin:0 0 8px;text-align:center}
p.sub{margin:0 0 24px;opacity:.75;text-align:center}
.card{width:100%;max-width:520px;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:16px;box-sizing:border-box}
svg{width:100%;height:auto;display:block}
#vp{overflow:hidden;height:80px}
#panel{position:sticky;bottom:0;z-index:5;width:100%;max-width:520px;margin-top:16px;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg)}
#cap{box-sizing:border-box;padding:12px 16px;border:2px solid var(--ink);border-radius:16px;background:var(--card);font-size:.95rem;max-height:28vh;overflow-y:auto;min-height:3.2em}
.ctl{display:flex;gap:12px;margin-top:10px;justify-content:center;flex-wrap:wrap}
button{background:var(--accent);color:#fff;border:2px solid var(--accent);border-radius:12px;padding:12px 18px;font-weight:700;font-size:1rem;cursor:pointer}
button:hover{background:var(--accent-h)}
button.alt{background:transparent;color:var(--ink);border-color:var(--ink)}
button.alt:hover{background:transparent;opacity:.7}
#go{min-width:130px}
.note{margin:8px 0 0;font-size:.85rem;opacity:.7;text-align:center}
.shape{stroke:#1E1540;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.4)}
.pop.on{animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.cur{filter:drop-shadow(0 0 7px var(--accent))}
.t{opacity:0;fill:var(--ink);text-anchor:middle;font-size:13px}
.t.on{animation:fade .4s ease forwards}
.ct{fill:#1E1540;font-weight:700;font-size:14px}
.cs{fill:#1E1540;font-size:11.5px}
.bt{fill:#1E1540;text-anchor:middle;font-weight:700;font-size:14px}
.gt{fill:var(--ink);text-anchor:middle;font-size:11px;font-weight:700}
.ln{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000}
.ln.on{animation:dash 1.2s ease-out forwards}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.pop.done{opacity:1;transform:none;animation:none}
.t.done{opacity:1;animation:none}
.ln.done{stroke-dashoffset:0;animation:none}
</style>
</head>
